# Implantação no Render (render.com → New → Blueprint → escolha este repositório).
# Informe DATABASE_URL de um PostgreSQL (Neon, Supabase ou Render Postgres) quando solicitado.
services:
  - type: web
    name: controle-de-ponto
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
