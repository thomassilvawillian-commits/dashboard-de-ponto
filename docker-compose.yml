# Sobe o sistema com PostgreSQL:  docker compose up -d   →  http://localhost:3000
services:
  app:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://ponto:ponto@db:5432/ponto
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
      POSTGRES_DB: ponto
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponto"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
